services:
  agent:
    build: .
    image: code-agent:latest
    env_file:
      - .env
    volumes:
      # ЕДИНСТВЕННАЯ папка, видимая агенту снаружи контейнера — сюда он пишет
      # реальные файлы, всё остальное (pip install, системные пакеты внутри
      # контейнера, попытки полезть куда-то ещё) остаётся внутри и исчезает
      # вместе с контейнером
      - ./workspace:/workspace
    stdin_open: true   # -it эквивалент для textual TUI, без этого экран не рисуется
    tty: true
    # без network_mode: none — агенту нужен доступ к Colab/Groq через интернет.
    # Если захочешь урезать сеть строже — придётся городить отдельный прокси
    # с allowlist на конкретные домены, это не 'из коробки' докера.
