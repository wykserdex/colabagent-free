[project]
name = "linux-code-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "textual>=0.60",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
code-agent = "code_agent.cli:app"
code-agent-tui = "code_agent.tui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# --- ДОБАВЛЯЕМ СЕКЦИЮ ДЛЯ ПАКЕТОВ В src/ ---
[tool.setuptools.packages.find]
where = ["src"]
